<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Team</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            background: url('imagines/marinel.jpg') no-repeat center center fixed;
        }

        /* Header */
        .header {
            padding: 20px;
            background: rgba(195, 191, 191, 0.849);
            text-align: left;
            font-size: 32px;
            font-weight: bold;
        }

        /* Navigation */
        .nav {
            display: flex;
            border-bottom: 2px solid #ddd;
            padding: 10px;
            gap: 20px;
        }

        .nav a {
            text-decoration: none;
            color: #666;
            font-size: 18px;
            padding-bottom: 5px;
        }

        .nav a.active {
            color: #5a2ff4;
            border-bottom: 3px solid #5a2ff4;
            font-weight: bold;
        }

        /* Container */
        .container {
            padding: 20px;
        }

        /* Section title */
        .section-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Players Grid */
        .players {
            display: flex;
            gap: 20px;
        }

        .player-card {
            background: linear-gradient(to bottom, #d4c7ff, #ffffff);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            width: 200px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        .player-card img {
            width: 100%;
            border-radius: 10px;
        }

        .player-info {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .player-number {
            font-size: 22px;
            font-weight: bold;
        }

        .player-position {
            color: gray;
            font-size: 14px;
        }

    </style>
</head>
<body>

    <div class="header">First Team</div>

    <div class="nav">
        <a href="#">News</a>
        <a href="#" class="active">Squad</a>
    </div>

    <div class="container">
        <div class="section-title">Goalkeeper</div>
        <div class="players">
            <div class="player-card">
                <img src="imagines/courtuis.jpg" alt="Courtois">
                <div class="player-info">
                    <span class="player-number">1</span> Courtois
                    <div class="player-position">Goalkeeper</div>
                </div>
            </div>

            <div class="player-card">
                <img src="imagines/lunin.jpg" alt="Lunin">
                <div class="player-info">
                    <span class="player-number">13</span> Lunin
                    <div class="player-position">Goalkeeper</div>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="section-title">Forward</div>
        <div class="players">
            <div class="player-card">
                <img src="imagines/rodrygo.jpg" alt="Courtois">
                <div class="player-info">
                    <span class="player-number">11</span>Rodrygo
                    <div class="player-position">Forward</div>
                </div>




</body>
</html>
